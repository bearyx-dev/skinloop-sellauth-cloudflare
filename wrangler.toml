name = "sellauth-skinloop-rust"
main = "src/worker.ts"
compatibility_date = "2026-09-22"
[vars]
SKINLOOP_API_BASE_URL = ""
SKINLOOP_HOSTED_ORIGIN = ""
SELLAUTH_API_BASE_URL = "https://api.sellauth.com/v1"
SELLAUTH_SHOP_ID = ""
[triggers]
crons = ["*/5 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "sellauth-skinloop-rust"
database_id = ""
migrations_dir = "migrations"
[[queues.producers]]
binding = "FULFILLMENT_QUEUE"
queue = "sellauth-skinloop-rust-fulfillment"
[[queues.consumers]]
queue = "sellauth-skinloop-rust-fulfillment"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "sellauth-skinloop-rust-dead-letter"